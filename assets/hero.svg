<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" preserveAspectRatio="xMaxYMid slice" role="img" aria-label="Animated attack path across network hosts">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2c3a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".28"/>
    </linearGradient>
  </defs>
  <style>
    .link{stroke:#27465a;stroke-width:1.5;fill:none}
    .node{fill:#0f1c27;stroke:#3a6a82;stroke-width:2}
    .crit{stroke:#ff5d5d}
    .path{stroke:#ff5d5d;stroke-width:2.5;fill:none;stroke-dasharray:10 8;animation:flow 1.6s linear infinite}
    .ring{fill:none;stroke:#ff5d5d;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
    .ring.d2{animation-delay:.8s}.ring.d3{animation-delay:1.6s}
    .scan{transform-origin:520px 130px;animation:rot 7s linear infinite}
    .lbl{font:600 11px 'IBM Plex Mono',ui-monospace,monospace;fill:#7e98ab}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    @keyframes rot{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.path,.ring,.scan{animation:none}}
  </style>
  <rect width="1000" height="260" fill="url(#grid)" opacity=".7"/>
  <circle cx="520" cy="130" r="150" fill="url(#glow)"/>
  <g class="scan"><path d="M520 130 L520 -20 A150 150 0 0 1 670 130 Z" fill="url(#sweep)"/></g>
  <circle cx="520" cy="130" r="110" fill="none" stroke="#1f3646" stroke-dasharray="3 6"/>
  <circle cx="520" cy="130" r="60" fill="none" stroke="#1f3646" stroke-dasharray="3 6"/>
  <!-- links -->
  <path class="link" d="M180 60 L360 110 L520 130 L700 80 L860 70"/>
  <path class="link" d="M360 110 L330 200 L520 130 L640 205 L780 180 L700 80"/>
  <path class="link" d="M860 70 L930 150 L780 180"/>
  <!-- attack path -->
  <path class="path" d="M180 60 L360 110 L520 130 L700 80 L860 70"/>
  <!-- nodes -->
  <g>
    <circle class="node" cx="180" cy="60" r="12"/><text class="lbl" x="150" y="38">ws-finance-04</text>
    <circle class="node" cx="360" cy="110" r="12"/><text class="lbl" x="330" y="90">vpn-gw</text>
    <circle class="node crit" cx="520" cy="130" r="16"/><text class="lbl" x="490" y="164">dc01</text>
    <circle class="node" cx="700" cy="80" r="12"/><text class="lbl" x="676" y="58">proxy</text>
    <circle class="node crit" cx="860" cy="70" r="12"/><text class="lbl" x="820" y="48">c2.relay.xyz</text>
    <circle class="node" cx="330" cy="200" r="10"/><circle class="node" cx="640" cy="205" r="10"/>
    <circle class="node" cx="780" cy="180" r="10"/><circle class="node" cx="930" cy="150" r="10"/>
  </g>
  <circle class="ring" cx="520" cy="130" r="16"/><circle class="ring d2" cx="520" cy="130" r="16"/><circle class="ring d3" cx="520" cy="130" r="16"/>
  <circle cx="520" cy="130" r="5" fill="#ff5d5d"/>
</svg>
